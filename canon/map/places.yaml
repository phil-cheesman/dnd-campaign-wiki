  sultray:         { x: 0.486, y: 0.708, plane: world, dossier: surtree,       city_map: null }  # calibrated — Surtree, Carasian river port (home base)
  kierkenwall:     { x: 0.549, y: 0.513, plane: world, dossier: kierkenwall,   city_map: null }  # calibrated — Gidian Empire capital
