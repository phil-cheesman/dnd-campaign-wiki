# Map places — canonical coordinates for the interactive Journey map.
#
# Coordinates are NORMALISED (0–1) over each map image, so they survive
# re-exports/resizes of Jon's source maps. x = fraction from left, y = fraction
# from top. The seeds below are APPROXIMATE eyeball placements on the real
# Alambor world map — refine any of them by opening /map?calibrate and clicking
# the map (it prints the normalised x,y to copy back here).
#
# `dossier`  → slug under canon/locations/ for the "<place> →" card link (null if none yet).
# `plane`    → world | avernus | shadowfell  (non-world stops are reached via a portal on the world map).
# `on`       → per-region coordinates for the Phase 3c regional maps (see `maps:` below).
#              A place's top-level x,y is its WORLD position; `on: { gidia: {x,y} }` adds
#              its position on the Gidia regional image. Calibrate via /map?calibrate&map=gidia.
#              Region members without an `on` coord are scattered on that region's image
#              (a "pin me down later" state), exactly like the world atlas does.

# --- Map registry (Phase 3c) -------------------------------------------------------------
# Every map (world + regional, + future city maps) is one entry here. Each region:
#   parent → the map you drill in FROM (world).
#   group  → the atlas kingdom-group slug to cross-filter the index to when this region is
#            active (null = no kingdom group, so no cross-filter — e.g. Dalacia is a
#            location, not a kingdom; its map still swaps in, pins appear as calibrated).
#   image / width / height → the committed display JPG + its pixel dims (for the Leaflet
#            bounds aspect ratio). Built by scripts/maps/build_displays.py; coords are
#            normalised so the downscale doesn't move any pin.
maps:
  world:
    # 2048px downscale of Jon's full-res export (world.jpg, 4096×3072, local-only) — 10×
    # cheaper to composite, so zoom stays smooth. width/height stay the NATIVE pixel space:
    # coords are normalised, so the 2048 image stretches over the same bounds correctly.
    image: /maps/world-display.jpg
    width: 4096
    height: 3072
    label: Alambor
  gidia:
    image: /maps/gidia-display.jpg
    width: 2048
    height: 1345
    label: Gidian Empire
    parent: world
    group: gidian-empire
  carasia:
    image: /maps/carasia-display.jpg
    width: 2048
    height: 1085
    label: Carasia
    parent: world
    group: carasian-kingdom
  dalacia:
    image: /maps/dalacia-display.jpg
    width: 2048
    height: 1560
    label: Dalacia
    parent: world
    group: null   # Dalacia is a location dossier, not an atlas kingdom group → no cross-filter (v1)

# Calibration pass (2026-06-15): re-pinned against the 4096×3072 grid. Places with
