  goldcrest:       { x: 0.510, y: 0.520, plane: world, dossier: goldcrest,     city_map: null }  # calibrated — Gidian port
  callum-heights:  { x: 0.435, y: 0.492, plane: world, dossier: null,          city_map: null }  # approx — mountain range NW of Goldcrest
  evershire:       { x: 0.555, y: 0.405, plane: world, dossier: evershire,     city_map: null }  # approx — Gidia/Dalacia border (lake valley)
